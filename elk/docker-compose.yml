services:
  # One-shot: creates the lab CA and one certificate per service, only if missing.
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es-setup
    user: "0"
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs
      - ./instances.yml:/usr/share/elasticsearch/config/instances.yml:ro
    command: >
      bash -c '
        set -e;
        if [ ! -f config/certs/ca/ca.crt ]; then
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip -o config/certs/ca.zip -d config/certs; rm config/certs/ca.zip;
        fi;
        if [ ! -f config/certs/elasticsearch/elasticsearch.crt ]; then
          bin/elasticsearch-certutil cert --silent --pem --in config/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key -out config/certs/certs.zip;
          unzip -o config/certs/certs.zip -d config/certs; rm config/certs/certs.zip;
        fi;
        chown -R root:root config/certs;
        find config/certs -type d -exec chmod 750 {} \; ;
        find config/certs -type f -exec chmod 640 {} \; ;
        echo "certificates ready"
      '

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: elasticsearch
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms3g -Xmx3g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./certs/ca/ca.crt:/usr/share/elasticsearch/config/certs/ca/ca.crt:ro
      - ./certs/elasticsearch:/usr/share/elasticsearch/config/certs/elasticsearch:ro
    ports:
      - "9200:9200"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - SERVER_PUBLICBASEURL=https://${SIEM_IP:-10.77.77.10}:5601
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=config/certs/kibana/kibana.crt
      - SERVER_SSL_KEY=config/certs/kibana/kibana.key
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_KEY}
    volumes:
      - ./certs/ca/ca.crt:/usr/share/kibana/config/certs/ca/ca.crt:ro
      - ./certs/kibana:/usr/share/kibana/config/certs/kibana:ro
    ports:
      - "5601:5601"
    restart: unless-stopped

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    container_name: fleet-server
    depends_on:
      - kibana
      - elasticsearch
    ports:
      - "${FLEET_PORT:-8220}:8220"
    restart: unless-stopped
    user: root
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://elasticsearch:9200
      - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
      - FLEET_SERVER_CERT=/certs/fleet-server/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/certs/fleet-server/fleet-server.key
      - FLEET_SERVER_SERVICE_TOKEN=${SERVICE_TOKEN}
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      # The container's own agent enrols into its local Fleet Server over TLS
      - FLEET_URL=https://fleet-server:8220
      - FLEET_CA=/certs/ca/ca.crt
    volumes:
      - ./certs/ca/ca.crt:/certs/ca/ca.crt:ro
      - ./certs/fleet-server:/certs/fleet-server:ro

volumes:
  esdata:
