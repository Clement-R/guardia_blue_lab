# Certificates generated by the "setup" service (elasticsearch-certutil).
# Every certificate carries the SIEM VM's IP, so clients can verify the server.
# If the IP changes: delete /opt/elk/certs on the VM and re-provision.
instances:
  - name: elasticsearch
    dns: [elasticsearch, localhost]
    ip: [10.77.77.10, 127.0.0.1]
  - name: kibana
    dns: [kibana, localhost]
    ip: [10.77.77.10, 127.0.0.1]
  - name: fleet-server
    dns: [fleet-server, localhost]
    ip: [10.77.77.10, 127.0.0.1]
